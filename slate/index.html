<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Redirecting… · Slate</title>
<meta name="robots" content="noindex" />
<!-- Slate moved to its own domain. This stays so every existing link, and the
     pages on this site that point at it, keep working. Canonical points at the
     new home so the two sites never compete for the same page. -->
<link rel="canonical" href="https://slatebooking.online/" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://slatebooking.online/" />
<meta property="og:title" content="Slate · Custom booking system for clinics" />
<meta property="og:description" content="A clean slate for your diary. Booking built around how your clinic works, live on your own website." />
<meta property="og:image" content="https://slatebooking.online/og.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://slatebooking.online/og.jpg" />
<meta http-equiv="refresh" content="0; url=https://slatebooking.online/" />
<script>location.replace('https://slatebooking.online/' + location.search + location.hash);</script>
</head>
<body style="background:#08070d;color:#a8a4b8;font-family:-apple-system,sans-serif;padding:40px;text-align:center">
<p>Slate has moved to <a href="https://slatebooking.online/" style="color:#FB7511">slatebooking.online</a>…</p>
</body>
</html>
