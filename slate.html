<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Redirecting… · Slate</title>
<meta name="robots" content="noindex" />
<!-- Slate moved to its own domain. This stays so every existing link, and the
     pages on this site that point at it, keep working. Canonical points at the
     new home so the two sites never compete for the same page. -->
<link rel="canonical" href="https://slatebooking.online/" />
<meta http-equiv="refresh" content="0; url=https://slatebooking.online/" />
<script>location.replace('https://slatebooking.online/' + location.search + location.hash);</script>
</head>
<body style="background:#08070d;color:#a8a4b8;font-family:-apple-system,sans-serif;padding:40px;text-align:center">
<p>Slate has moved to <a href="https://slatebooking.online/" style="color:#FB7511">slatebooking.online</a>…</p>
</body>
</html>
